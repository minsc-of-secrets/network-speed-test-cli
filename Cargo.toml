[package]
name = "nst"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A lightweight CLI network speed test"
repository = "https://github.com/minsc-of-secrets/network-speed-test-cli"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["speedtest", "network", "cli", "bandwidth"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "nst"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.18"
async-trait = "0.1"
anyhow = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "test-util"] }
